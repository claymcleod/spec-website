{% extends "base.html" %}

{% block title %}Page Not Found — {{ config.title }}{% endblock title %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
    <p class="text-6xl font-mono font-bold text-teal-700 dark:text-teal-500 mb-4">404</p>
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-3">Page not found</h1>
    <p class="text-gray-600 dark:text-gray-200 max-w-md mb-8">
        The page you're looking for doesn't exist, or it may not exist in this version of the specification.
    </p>
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 w-full px-4 sm:px-0">
        <a href="{{ get_url(path=config.extra.current_version ~ '/introduction/') }}" class="inline-flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-3 bg-teal-500 hover:bg-teal-600 text-gray-900 font-semibold rounded-md transition-colors">
            <span>📖</span>
            Read the Spec
        </a>
        <a href="{{ get_url(path='/') }}" class="inline-flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-3 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-100 font-semibold rounded-md border border-gray-300 dark:border-gray-600 transition-colors">
            <i class="fa-solid fa-house"></i>
            Go Home
        </a>
    </div>
</div>
{% endblock content %}
